name: Android
on:
  pull_request:
  push:
    branches: [master, 'codex/mobile-use-features']
  workflow_dispatch:
defaults:
  run:
    shell: bash

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Test impact plan
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      swift: ${{ steps.plan.outputs.swift }}
      safety: ${{ steps.plan.outputs.safety }}
      android: ${{ steps.plan.outputs.android }}
      full: ${{ steps.plan.outputs.full }}
      replay: ${{ steps.plan.outputs.replay }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22.2'
      - id: plan
        run: node scripts/ci-test-plan.js

  android:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require a valid plan
        run: test "${{ needs.plan.result }}" = success
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
      - name: Shared agent source and generated bundle
        run: npm run check:agent-core && npm run test:agent-core && node --test scripts/android-task-report.test.js scripts/android-target.test.js
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: JVM, Lint and both APK variants
        run: npm run check:android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated Android 16 runtime fixtures
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: npm run test:android:connected
      - name: Compare Android task events with Node
        run: npm run eval:tasks -- --compare .tmp/agent-task-eval-android.json --out .tmp/agent-task-eval-node.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-verification
          retention-days: 7
          include-hidden-files: true
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            .tmp/android-fixture-logcat.log
            .tmp/agent-task-eval-android.json
            .tmp/agent-task-eval-node.json
            android/app/build/outputs/apk/debug/*.apk
