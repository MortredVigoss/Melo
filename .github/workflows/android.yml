name: Android
on:
  pull_request:
    paths: ['android/**', 'scripts/android*', 'scripts/build-agent-core.mjs', 'shared/**', 'src/shared/replyDocument.js', 'ios/Melo/Scene/**', 'mobile-sync/**', 'package*.json', '.github/workflows/android.yml']
  push:
    branches: [master, 'codex/mobile-use-features']
    paths: ['android/**', 'scripts/android*', 'scripts/build-agent-core.mjs', 'shared/**', 'src/shared/replyDocument.js', 'ios/Melo/Scene/**', 'mobile-sync/**', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts
      - name: Shared agent source and generated bundle
        run: npm run check:agent-core && npm run test:agent-core
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: JVM, Lint and both APK variants
        run: npm run check:android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated Android 16 runtime fixtures
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: npm run test:android:connected
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-verification
          retention-days: 7
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/*.apk
