name: File safety

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: file-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Test impact plan
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      swift: ${{ steps.plan.outputs.swift }}
      safety: ${{ steps.plan.outputs.safety }}
      android: ${{ steps.plan.outputs.android }}
      full: ${{ steps.plan.outputs.full }}
      replay: ${{ steps.plan.outputs.replay }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22.2'
      - id: plan
        run: node scripts/ci-test-plan.js

  safety:
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.safety == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Require a valid plan
        run: test "${{ needs.plan.result }}" = success
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      # Build the local addon on each OS. Other install hooks (media downloads)
      # are unnecessary for this focused gate; no host binary is reused.
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Approval, identity, backup and trash regressions
        run: node --test src/safety/*.test.js src/tools/builtins/phase2a.fileTools.test.js
