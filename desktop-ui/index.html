<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Melo Desktop</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- Importmap so the Demon 3D renderer can say `import * as THREE from 'three'`
         and `import { OrbitControls } from 'three/addons/controls/OrbitControls.js'`
         without a bundler. The server serves these from node_modules under
         /vendor/three/*. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.min.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
