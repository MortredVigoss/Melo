    <!-- Importmap so the Demon 3D renderer can say `import * as THREE from 'three'`
         and `import { OrbitControls } from 'three/addons/controls/OrbitControls.js'`
         without a bundler. The server serves these from node_modules under
         /vendor/three/*. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.min.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/launchScreen.js"></script>
    <script type="module" src="/app.js" onerror="window.MeloLaunch?.show({phase:'error',detail:'界面资源未能载入，请重新打开 Melo。'})"></script>
  </body>
